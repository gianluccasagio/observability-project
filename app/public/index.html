<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce MVP - DevStore</title>
    <style>
        :root {
            --primary: #4F46E5;
            --success: #10B981;
            --danger: #EF4444;
            --bg: #F3F4F6;
            --text: #1F2937;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .dashboard {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .header {
            margin-bottom: 2rem;
        }
        .header h1 {
            margin: 0;
            font-size: 2rem;
            color: var(--primary);
        }
        .version-badge {
            display: inline-block;
            background: #E0E7FF;
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: bold;
            margin-top: 10px;
        }
        .action-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        button {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:active {
            transform: scale(0.98);
        }
        button:hover {
            opacity: 0.9;
        }
        .btn-success { background-color: var(--success); }
        .btn-danger { background-color: var(--danger); }
        .btn-primary { background-color: var(--primary); }

        .status-box {
            padding: 1rem;
            border-radius: 8px;
            background: #F9FAFB;
            border: 1px solid #E5E7EB;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: #6B7280;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <h1>🛒 DevStore Simulator</h1>
        <div class="version-badge" id="app-version">App Versão 1.0.0</div>
    </div>

    <div class="action-group">
        <button class="btn-success" onclick="simularCompra()">
            ✅ Simular Compra com Sucesso (Info Log)
        </button>
        <button class="btn-danger" onclick="simularFalhaPagamento()">
            ❌ Simular Falha no Pagamento (Error Log)
        </button>
        <button class="btn-primary" onclick="simularBlackFriday()">
            🚀 Simular Tráfego Black Friday (50 Req)
        </button>
    </div>

    <div class="status-box" id="status">
        Nenhuma ação realizada ainda.
    </div>
</div>

<script>
    const statusEl = document.getElementById('status');

    function updateStatus(msg, isError = false) {
        statusEl.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${msg}`;
        statusEl.style.color = isError ? 'var(--danger)' : 'var(--text)';
    }

    async function simularCompra() {
        try {
            updateStatus('Processando checkout...');
            const response = await fetch('/api/checkout');
            if (response.ok) {
                updateStatus('Compra finalizada com sucesso! Log (200) gerado.');
            } else {
                updateStatus('Falha ao processar compra.', true);
            }
        } catch (error) {
            updateStatus('Erro na requisição: ' + error.message, true);
        }
    }

    async function simularFalhaPagamento() {
        try {
            updateStatus('Processando pagamento...');
            const response = await fetch('/api/payment-error');
            if (!response.ok) {
                updateStatus('Pagamento negado! Log (500) gerado.', true);
            } else {
                updateStatus('Falha: Esperava erro 500 mas retornou ' + response.status);
            }
        } catch (error) {
            updateStatus('Erro na requisição: ' + error.message, true);
        }
    }

    async function simularBlackFriday() {
        updateStatus('Iniciando pico de Black Friday (50 requisições simultâneas)...');
        let successCount = 0;
        let failCount = 0;

        const requests = [];
        for (let i = 0; i < 50; i++) {
            requests.push(
                fetch('/api/checkout')
                    .then(res => {
                        if (res.ok) successCount++;
                        else failCount++;
                    })
                    .catch(() => failCount++)
            );
        }

        await Promise.all(requests);
        updateStatus(`🚀 Pico finalizado: ${successCount} compras simuladas com sucesso, ${failCount} falhas.`);
    }
</script>

</body>
</html>
